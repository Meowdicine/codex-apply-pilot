<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">最终提交的 at-most-once 协议</title>
  <desc id="desc">先持久化提交意图，再执行一次点击；未知结果永不重试，只能凭官方回执收敛。</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d79b00"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6b656"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g><path d="M 270 260 L 310 260 L 310 260 L 350 260" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="214" y="235" width="192" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="310" y="249" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">CAS stateVersion</text></g>
  <g><path d="M 600 260 L 645 260 L 645 260 L 690 260" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arrow-orange)"/><rect x="579" y="235" width="132" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645" y="249" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">intent 已持久化</text></g>
  <g><path d="M 910 260 L 960 260 L 960 260 L 1010 260" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arrow-orange)"/><rect x="933" y="235" width="54" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="960" y="249" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">最多一次</text></g>
  <g><path d="M 1190 260 L 1230 260 L 1230 145 L 1270 145" fill="none" stroke="#82b366" stroke-width="2" marker-end="url(#arrow-green)"/><rect x="1203" y="178" width="54" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1230" y="192" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">是</text></g>
  <g><path d="M 1190 260 L 1230 260 L 1230 395 L 1270 395" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="1194" y="303" width="72" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1230" y="317" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">否 / 超时</text></g>
  <g><path d="M 1270 395 L 1245 395 L 1245 565 L 1220 565" fill="none" stroke="#82b366" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="8 4"/><rect x="1218" y="455" width="54" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1245" y="469" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">只读核验</text></g>
  <g><path d="M 1220 565 L 1245 565 L 1245 145 L 1270 145" fill="none" stroke="#82b366" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="8 4"/><rect x="1218" y="330" width="54" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1245" y="344" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">官方证据</text></g>
  <text x="390" y="40" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#1f2937"><tspan x="390" dy="0">最终提交｜write intent before click</tspan></text>
  <g><rect x="50" y="210" width="220" height="100" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="160" y="250" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="160" dy="0">候选 preflight 通过</tspan><tspan x="160" dy="21">submitAttemptCount = 0</tspan></text></g>
  <g><path d="M 350 220 C 350 207, 600 207, 600 220 L 600 300 C 600 313, 350 313, 350 300 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="475" y="250" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="475" dy="0">原子写入 submit-intent</tspan><tspan x="475" dy="21">消费 idempotency key</tspan></text></g>
  <g><rect x="690" y="210" width="220" height="100" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="2" stroke-dasharray="8 4"/><text x="800" y="250" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="800" dy="0">雇主门户</tspan><tspan x="800" dy="21">允许一次 final click</tspan></text></g>
  <g><polygon points="1100,210 1190,260 1100,310 1010,260" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1100" y="260" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1100" dy="0">结果是否明确？</tspan></text></g>
  <g><rect x="1270" y="100" width="190" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1365" y="135" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1365" dy="0">官方成功回执</tspan><tspan x="1365" dy="21">submitted-verified</tspan></text></g>
  <g><rect x="1270" y="350" width="190" height="90" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1365" y="385" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1365" dy="0">unknown-submit-state</tspan><tspan x="1365" dy="21">NO RETRY</tspan></text></g>
  <g><rect x="970" y="520" width="250" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1095" y="555" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1095" dy="0">之后若见官方回执</tspan><tspan x="1095" dy="21">只 reconcile，不再点击</tspan></text></g>
  <g><rect x="1280" y="615" width="190" height="135" fill="#ffffff" stroke="#6b7280"/><text x="1290" y="635" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#374151">图例</text><rect x="1290" y="644" width="28" height="14" fill="#dae8fc" stroke="#6c8ebf"/><text x="1328" y="656" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">本地模块</text><rect x="1290" y="669" width="28" height="14" fill="#ffe6cc" stroke="#d79b00"/><text x="1328" y="681" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">外部动作</text><rect x="1290" y="694" width="28" height="14" fill="#d5e8d4" stroke="#82b366"/><text x="1328" y="706" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">已验证结果</text><rect x="1290" y="719" width="28" height="14" fill="#f8cecc" stroke="#b85450"/><text x="1328" y="731" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">停止或未知</text></g>
</svg>
