  <g><path d="M 450 410 L 450 475 L 440 475 L 440 540" fill="none" stroke="#9673a6" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="415" y="450" width="60" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="445" y="464" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">仅使用引用</text></g>
