  <g><rect x="330" y="290" width="240" height="120" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="450" y="340" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="450" dy="0">Codex Plugin + CLI</tspan><tspan x="450" dy="21">问卷、策略、状态机</tspan></text></g>
  <g><rect x="330" y="90" width="240" height="100" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 4"/><text x="450" y="130" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="450" dy="0">Simplify 官方 UI</tspan><tspan x="450" dy="21">Copilot / Resume Builder</tspan></text></g>
