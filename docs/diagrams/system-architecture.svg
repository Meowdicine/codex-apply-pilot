  <g><rect x="1040" y="310" width="270" height="100" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 4"/><text x="1175" y="350" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1175" dy="0">已验证条款的雇主门户</tspan><tspan x="1175" dy="21">候选级适配器</tspan></text></g>
  <g><rect x="670" y="540" width="220" height="90" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="780" y="575" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="780" dy="0">官方成功回执</tspan><tspan x="780" dy="21">或 unknown no-repeat</tspan></text></g>
  <g><rect x="1200" y="675" width="190" height="135" fill="#ffffff" stroke="#6b7280"/><text x="1210" y="695" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#374151">图例</text><rect x="1210" y="704" width="28" height="14" fill="#dae8fc" stroke="#6c8ebf"/><text x="1248" y="716" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">本地模块</text><rect x="1210" y="729" width="28" height="14" fill="#e1d5e7" stroke="#9673a6"/><text x="1248" y="741" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">秘密或安全边界</text><rect x="1210" y="754" width="28" height="14" fill="#f5f5f5" stroke="#666666"/><text x="1248" y="766" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">第三方系统</text><rect x="1210" y="779" width="28" height="14" fill="#d5e8d4" stroke="#82b366"/><text x="1248" y="791" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">已验证结果</text></g>
