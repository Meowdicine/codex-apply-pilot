  <g><rect x="850" y="240" width="200" height="90" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="950" y="275" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="950" dy="0">Gate 2</tspan><tspan x="950" dy="21">审核精确 manifest</tspan></text></g>
  <g><rect x="850" y="430" width="200" height="90" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="950" y="465" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="950" dy="0">全自动成熟度</tspan><tspan x="950" dy="21">同意、域名、上限</tspan></text></g>
  <g><rect x="1120" y="430" width="200" height="90" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="1220" y="465" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1220" dy="0">策略化 preflight</tspan><tspan x="1220" dy="21">新门户降级半自动</tspan></text></g>
