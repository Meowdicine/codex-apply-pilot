<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">安全与信任边界</title>
  <desc id="desc">本地事实、秘密库、浏览器工作区、人工安全动作和第三方系统之间的数据边界。</desc>
  <defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8ebf"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d79b00"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g><path d="M 240 210 L 405 210 L 405 215 L 570 215" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="363" y="188" width="84" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="405" y="202" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">已验证普通事实</text></g>
  <g><path d="M 350 395 L 460 395 L 460 215 L 570 215" fill="none" stroke="#9673a6" stroke-width="2" marker-end="url(#arrow-purple)" stroke-dasharray="8 4"/><rect x="382" y="280" width="156" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="460" y="294" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">运行时 secretRef</text></g>
  <g><path d="M 740 215 L 895 215 L 895 385 L 1050 385" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arrow-orange)"/><rect x="853" y="275" width="84" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="895" y="289" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">允许的表单动作</text></g>
  <g><path d="M 850 420 L 980 420 L 980 550 L 1110 550" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrow-red)"/><rect x="950" y="460" width="60" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="980" y="474" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">仅用户完成</text></g>
  <g><path d="M 740 215 L 895 215 L 895 215 L 1050 215" fill="none" stroke="#666666" stroke-width="2" marker-end="url(#arrow-grey)" stroke-dasharray="8 4"/><rect x="841" y="190" width="108" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="895" y="204" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">只生成用户操作步骤</text></g>
  <g><path d="M 1050 385 L 970 610 L 480 610 L 480 210 L 420 210" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="438" y="585" width="84" height="20" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="480" y="599" text-anchor="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">非秘密官方回执</text></g>
  <g><rect x="40" y="90" width="420" height="570" rx="8" fill="#dae8fc" fill-opacity="0.28" stroke="#6c8ebf" stroke-width="2"/><line x1="40" y1="126" x2="460" y2="126" stroke="#6c8ebf"/><text x="54" y="113" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1f2937">本地受控边界</text></g>
  <g><rect x="520" y="90" width="420" height="570" rx="8" fill="#ffe6cc" fill-opacity="0.28" stroke="#d79b00" stroke-width="2"/><line x1="520" y1="126" x2="940" y2="126" stroke="#d79b00"/><text x="534" y="113" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1f2937">用户浏览器边界</text></g>
  <g><rect x="1000" y="90" width="420" height="570" rx="8" fill="#f5f5f5" fill-opacity="0.28" stroke="#666666" stroke-width="2"/><line x1="1000" y1="126" x2="1420" y2="126" stroke="#666666"/><text x="1014" y="113" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="15" font-weight="700" fill="#1f2937">第三方系统边界</text></g>
  <text x="440" y="40" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#1f2937"><tspan x="440" dy="0">安全与信任边界｜秘密不进入仓库或日志</tspan></text>
  <g><rect x="90" y="170" width="150" height="80" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="165" y="200" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="165" dy="0">问卷事实</tspan><tspan x="165" dy="21">来源与有效期</tspan></text></g>
  <g><path d="M 260 180 C 260 167, 420 167, 420 180 L 420 240 C 420 253, 260 253, 260 240 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="340" y="200" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="340" dy="0">状态与回执</tspan><tspan x="340" dy="21">候选级 no-repeat</tspan></text></g>
  <g><rect x="150" y="350" width="200" height="90" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="250" y="385" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="250" dy="0">OS Secret Vault</tspan><tspan x="250" dy="21">密码 / token 不渲染</tspan></text></g>
  <g><rect x="570" y="170" width="170" height="90" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="655" y="205" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="655" dy="0">候选级适配器</tspan><tspan x="655" dy="21">精确 HTTPS 与域名</tspan></text></g>
  <g><rect x="610" y="370" width="240" height="100" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="730" y="410" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="730" dy="0">人工安全动作</tspan><tspan x="730" dy="21">CAPTCHA / OTP / OAuth</tspan></text></g>
  <g><rect x="1050" y="170" width="170" height="90" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 4"/><text x="1135" y="205" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1135" dy="0">Simplify 官方 UI</tspan><tspan x="1135" dy="21">仅用户/官方功能</tspan></text></g>
  <g><rect x="1050" y="340" width="190" height="90" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="8 4"/><text x="1145" y="375" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1145" dy="0">雇主门户</tspan><tspan x="1145" dy="21">逐站条款与 allowlist</tspan></text></g>
  <g><rect x="1110" y="510" width="180" height="80" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1200" y="540" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="14" font-weight="500" fill="#1f2937"><tspan x="1200" dy="0">安全挑战</tspan><tspan x="1200" dy="21">不绕过</tspan></text></g>
  <g><rect x="1280" y="675" width="190" height="135" fill="#ffffff" stroke="#6b7280"/><text x="1290" y="695" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="13" font-weight="700" fill="#374151">图例</text><rect x="1290" y="704" width="28" height="14" fill="#dae8fc" stroke="#6c8ebf"/><text x="1328" y="716" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">本地模块</text><rect x="1290" y="729" width="28" height="14" fill="#e1d5e7" stroke="#9673a6"/><text x="1328" y="741" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">秘密或安全边界</text><rect x="1290" y="754" width="28" height="14" fill="#f5f5f5" stroke="#666666"/><text x="1328" y="766" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">第三方系统</text><rect x="1290" y="779" width="28" height="14" fill="#f8cecc" stroke="#b85450"/><text x="1328" y="791" font-family="Segoe UI, Noto Sans SC, sans-serif" font-size="12" fill="#374151">停止或未知</text></g>
</svg>
